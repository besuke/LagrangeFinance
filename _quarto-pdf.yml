project:
  output-dir: _pdf_build

book:
  output-file: "lagrange-finance"

format:
  pdf:
    pdf-engine: lualatex
    documentclass: ltjsbook
    papersize: a4
    toc: true
    number-sections: false
    keep-tex: true

    classoption:
      - openany

    include-in-header:
      text: |
        \usepackage[haranoaji]{luatexja-preset}
        \usepackage{graphicx}
        \usepackage{eso-pic}

        \renewcommand{\maketitle}{%
          \thispagestyle{empty}
          \AddToShipoutPictureBG*{%
            \AtPageLowerLeft{%
              \includegraphics[width=\paperwidth,height=\paperheight]{images/cover.png}%
            }%
          }%
          \null
          \clearpage
        }

    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm