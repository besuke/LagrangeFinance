project:
  output-dir: _pdf_exclude_build

book:
  output-file: "lagrange-finance-exclude"

filters:
  - watermark-exclude.lua

format:
  pdf:
    pdf-engine: lualatex
    documentclass: ltjsbook
    papersize: a4
    toc: true
    number-sections: false
    keep-tex: true

    classoption:
      - openany

    include-in-header:
      text: |
        \usepackage[haranoaji]{luatexja-preset}
        \usepackage{graphicx}
        \usepackage{eso-pic}
        \usepackage{xcolor}

        % Cover
        \renewcommand{\maketitle}{%
          \thispagestyle{empty}
          \AddToShipoutPictureBG*{%
            \AtPageLowerLeft{%
              \includegraphics[width=\paperwidth,height=\paperheight]{images/cover.png}%
            }%
          }
          \null
          \clearpage
        }

        % Training exclusion watermark
        \newcommand{\ExcludeWatermark}{%
          \AtPageCenter{%
            \makebox(0,0)[c]{%
              \rotatebox[origin=c]{45}{%
                \color{black!12}%
                \fontsize{180}{190}\selectfont%
                \bfseries%
                対象外%
              }%
            }%
          }%
        }

        \newcommand{\ExcludeWatermarkOn}{%
          \AddToShipoutPictureFG{\ExcludeWatermark}%
        }

        \newcommand{\ExcludeWatermarkOff}{%
          \ClearShipoutPictureFG%
        }

    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm