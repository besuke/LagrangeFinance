project:
  type: book
  execute-dir: project

book:
  title: "エンタープライズ金融モデル構築"
  subtitle: "Rによるデータモデリング・金融工学・並列分散コンピュータ自動微分"
  author: "Eiichi Horigome"
  cover-image: images/cover.png
  output-file: "lagrangeFinance"

  chapters:
    - index.qmd

    - part: "第I部 金融工学　均衡モデル"
      chapters:
        - part1_empirical/ch01_r_basics_tidyverse.qmd
        - part1_empirical/ch02_financial_data.qmd
        - part1_empirical/ch03_stock_data_time_series.qmd
        - part1_empirical/ch04_factor_models.qmd
        - part1_empirical/ch05_asset_pricing.qmd
        - part1_empirical/ch06_event_study.qmd
        - part1_empirical/ch07_machine_learning_factor_selection.qmd
        - part1_empirical/ch08_constrained_portfolio_optimization.qmd

    - part: "第II部 金融工学　無裁定モデル"
      chapters:
        - part2_quantive_riemann/ch01_deterministic_cashflow_valuation.qmd
        - part2_quantive_riemann/ch02_interest_rate_curves.qmd
        - part2_quantive_riemann/ch03_ois_swaps_multicurve.qmd
        - part2_quantive_riemann/ch04_black_model.qmd
        - part2_quantive_riemann/ch05_normal_model.qmd
        - part2_quantive_riemann/ch06_sabr_model.qmd
        - part2_quantive_riemann/ch07_callable_hull_white.qmd
        - part2_quantive_riemann/ch08_credit_risk_cds.qmd
        - part2_quantive_riemann/ch09_exotic_derivatives_prdc.qmd

    - part: "第III部 並列・分散処理から自動微分へ"
      chapters:
        - part3_enterprise_riemann/ch01_computational_evolution_parallel.qmd
        - part3_enterprise_riemann/ch02_distributed_computing_jobtask.qmd
        - part3_enterprise_riemann/ch03_enterprise_financial_computing.qmd
        - part3_enterprise_riemann/ch04_automatic_differentiation.qmd
        - part3_enterprise_riemann/ch05_option_greeks_autodiff.qmd
        - part3_enterprise_riemann/ch06_interest_rate_risk_autodiff.qmd
        - part3_enterprise_riemann/ch07_prdc_autodiff.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    number-sections: false

execute:
  eval: true
  echo: true
  warning: false
  message: false
  error: true